<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradMissa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C62828"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
    <filter id="shadowMissa" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bgGradMissa)" filter="url(#shadowMissa)"/>

  <!-- Church Building Body (White / Cream) -->
  <!-- Main Nave -->
  <path d="M16 52 L16 34 L32 23 L48 34 L48 52 Z" fill="#FFFDF8"/>
  
  <!-- Church Roof trims -->
  <path d="M14 35 L32 22 L50 35 L47 37 L32 26 L17 37 Z" fill="#D32F2F"/>

  <!-- Central Bell Tower / Campanário -->
  <rect x="27" y="14" width="10" height="12" fill="#FFFDF8"/>
  <!-- Tower Pyramid Roof -->
  <polygon points="32,7 26,14 38,14" fill="#D32F2F"/>

  <!-- Cross on top of the church -->
  <g fill="#FFD54F">
    <rect x="31.2" y="2" width="1.6" height="6" rx="0.3"/>
    <rect x="29.5" y="3.5" width="5" height="1.5" rx="0.3"/>
  </g>

  <!-- Church Bell in tower arch -->
  <path d="M29 17 Q32 15 35 17 L36 21 L28 21 Z" fill="#FFC107"/>
  <circle cx="32" cy="22" r="1" fill="#FFA000"/>

  <!-- Rose Window / Vitral -->
  <circle cx="32" cy="32" r="4.5" fill="#E1F5FE" stroke="#FFD54F" stroke-width="1"/>
  <circle cx="32" cy="32" r="2" fill="#81D4FA"/>

  <!-- Church Portal / Arched Main Door -->
  <path d="M28 52 L28 42 C28 39, 36 39, 36 42 L36 52 Z" fill="#5D4037"/>
  <!-- Door divider -->
  <line x1="32" y1="41" x2="32" y2="52" stroke="#3E2723" stroke-width="0.8"/>

  <!-- Steps in front of church -->
  <rect x="22" y="52" width="20" height="2" fill="#D7CCC8"/>
</svg>
