		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', function() {
					navigator.serviceWorker.register('sw.js').then(function(reg) {
						console.log('[PWA] Service Worker registrado com sucesso:', reg.scope);
					}).catch(function(err) {
						console.log('[PWA] Falha ao registrar Service Worker:', err);
					});
				});
			}

			// PWA Install Prompt Handler
			window.deferredPrompt = null;
			window.addEventListener('beforeinstallprompt', function(e) {
				e.preventDefault();
				window.deferredPrompt = e;
				var banner = document.getElementById('pwa-install-banner');
				if (banner) banner.style.display = 'flex';
			});

			window.installPWA = function() {
				var banner = document.getElementById('pwa-install-banner');
				if (window.deferredPrompt) {
					window.deferredPrompt.prompt();
					window.deferredPrompt.userChoice.then(function(choiceResult) {
						if (choiceResult.outcome === 'accepted') {
							console.log('[PWA] Usuário instalou o aplicativo!');
						}
						window.deferredPrompt = null;
						if (banner) banner.style.display = 'none';
					});
				} else {
					alert('Para instalar no seu iPhone ou iPad:\n1. Toque no botão Compartilhar (ícone com quadrado e seta para cima)\n2. Role para baixo e selecione "Adicionar à Tela de Início".');
				}
			};
		</script>
