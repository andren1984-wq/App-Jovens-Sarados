<ion-modal-view class="modal-editar-missao" style="background: #0A0E2A;">
	<ion-header-bar class="bar-stable bar-dark" style="background: linear-gradient(135deg, #101650 0%, #0A0E2A 100%) !important; border-bottom: 1.5px solid rgba(255,255,255,0.12);">
		<button class="button button-clear" ng-click="fecharModalEdicao()" style="color: #FFFFFF; font-weight: 700; font-size: 13px;">
			<i class="icon ion-close-round"></i> Cancelar
		</button>
		<h1 class="title" style="color: #FFFFFF !important; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px;">
			<i class="icon ion-edit" style="color: #FFAA00;"></i> {{missaoEmEdicao.id ? 'Editar Missão' : 'Nova Missão'}}
		</h1>
		<button class="button button-clear" ng-click="salvarMissaoEdicao()" style="color: #10B981; font-weight: 800; font-size: 13px;">
			<i class="icon ion-checkmark-round"></i> Salvar
		</button>
	</ion-header-bar>

	<ion-content class="padding" style="background: #F8FAFC;">
		
		<div style="background: #FFFFFF; border-radius: 16px; padding: 16px; box-shadow: 0 4px 15px rgba(16,22,80,0.06); margin-bottom: 20px; border: 1.5px solid #E2E8F0;">
			
			<!-- Prévia do Logo da Missão com Opção de Trocar -->
			<div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1.5px solid #F1F5F9;">
				<div style="width: 64px; height: 64px; border-radius: 14px; overflow: hidden; background: #101650; border: 2px solid #003CFF; flex-shrink: 0; box-shadow: 0 3px 10px rgba(0,60,255,0.2);">
					<img ng-src="{{missaoEmEdicao.logoUrl || 'img/brand/insta-profile-logo.jpg'}}" alt="Logo" style="width: 100%; height: 100%; object-fit: cover;">
				</div>
				<div style="flex: 1; min-width: 0;">
					<h4 style="margin: 0 0 4px; font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 800; color: #101650;">
						Logo da Missão
					</h4>
					<label class="button button-small button-outline button-positive" style="border-radius: 10px; font-size: 11px; font-weight: 800; height: 30px; line-height: 28px; cursor: pointer;">
						<i class="icon ion-camera"></i> Trocar Imagem do Logo
						<input type="file" accept="image/*" onchange="angular.element(this).scope().onLogoSelecionado(this)" style="display: none;">
					</label>
				</div>
			</div>

			<div class="list" style="margin: 0;">
				<label class="item item-input item-stacked-label" style="border: 1.5px solid #E2E8F0; border-radius: 12px; margin-bottom: 10px; padding: 8px 12px;">
					<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">Nome da Missão:</span>
					<input type="text" ng-model="missaoEmEdicao.nome" placeholder="Ex: Sobradinho, Taguatinga, Barra Funda..." style="font-size: 13px; color: #1E293B;">
				</label>

				<div style="display: flex; gap: 8px; margin-bottom: 10px;">
					<label class="item item-input item-stacked-label" style="flex: 1.2; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 8px 12px;">
						<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">Cidade:</span>
						<input type="text" ng-model="missaoEmEdicao.cidade" placeholder="Ex: Sobradinho" style="font-size: 13px; color: #1E293B;">
					</label>

					<label class="item item-input item-stacked-label" style="flex: 0.8; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 8px 12px;">
						<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">Estado / UF:</span>
						<input type="text" ng-model="missaoEmEdicao.estado" placeholder="Ex: DF, SP, RJ..." style="font-size: 13px; color: #1E293B; text-transform: uppercase;">
					</label>
				</div>

				<div style="display: flex; gap: 8px; margin-bottom: 10px;">
					<label class="item item-input item-select" style="flex: 1; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 8px 12px;">
						<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">Região:</span>
						<select ng-model="missaoEmEdicao.regiao" style="font-size: 12px;">
							<option value="Centro-Oeste">Centro-Oeste</option>
							<option value="Sudeste">Sudeste</option>
							<option value="Sul">Sul</option>
							<option value="Nordeste">Nordeste</option>
							<option value="Norte">Norte</option>
						</select>
					</label>

					<label class="item item-input item-select" style="flex: 1; border: 1.5px solid #E2E8F0; border-radius: 12px; padding: 8px 12px;">
						<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">Status:</span>
						<select ng-model="missaoEmEdicao.status" style="font-size: 12px;">
							<option value="Ativa">Ativa</option>
							<option value="Desativada">Desativada</option>
						</select>
					</label>
				</div>

				<!-- DIA E HORÁRIO (COM SUPORTE A QUINZENAL) -->
				<label class="item item-input item-stacked-label" style="border: 1.5px solid #E2E8F0; border-radius: 12px; margin-bottom: 10px; padding: 8px 12px;">
					<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">
						<i class="icon ion-clock" style="color: #FF6A00;"></i> Dia & Horário da Missão:
					</span>
					<input type="text" ng-model="missaoEmEdicao.diaHora" placeholder="Ex: Quinzenal • Sábado às 19h30 ou Toda Quinta 20h" style="font-size: 13px; color: #1E293B;">
				</label>

				<!-- ENDEREÇO DA PARÓQUIA / LOCAL -->
				<label class="item item-input item-stacked-label" style="border: 1.5px solid #E2E8F0; border-radius: 12px; margin-bottom: 10px; padding: 8px 12px;">
					<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">
						<i class="icon ion-android-pin" style="color: #003CFF;"></i> Endereço (Paróquia / Capela / Rua):
					</span>
					<textarea rows="2" ng-model="missaoEmEdicao.endereco" placeholder="Ex: Paróquia São José Operário — Quadra 13, Sobradinho II" style="font-size: 13px; color: #1E293B; width: 100%;"></textarea>
				</label>

				<!-- LINK DO INSTAGRAM DA MISSÃO (COLUNA G) -->
				<label class="item item-input item-stacked-label" style="border: 1.5px solid #E2E8F0; border-radius: 12px; margin-bottom: 10px; padding: 8px 12px;">
					<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">
						<i class="icon ion-social-instagram" style="color: #E1306C;"></i> Link do Instagram da Missão:
					</span>
					<input type="text" ng-model="missaoEmEdicao.instagramLink" placeholder="Ex: https://www.instagram.com/js.sobradinho2" style="font-size: 13px; color: #1E293B;">
				</label>

				<label class="item item-input item-stacked-label" style="border: 1.5px solid #E2E8F0; border-radius: 12px; margin-bottom: 14px; padding: 8px 12px;">
					<span class="input-label" style="font-weight: 700; font-size: 12px; color: #101650;">@ do Instagram (Texto):</span>
					<input type="text" ng-model="missaoEmEdicao.instagramText" placeholder="Ex: js.sobradinho" style="font-size: 13px; color: #1E293B;">
				</label>

				<button type="button" class="button button-block" ng-click="salvarMissaoEdicao()" style="background: linear-gradient(135deg, #003CFF 0%, #101650 100%); color: #FFFFFF; font-weight: 800; font-size: 13px; border-radius: 12px; margin: 0; box-shadow: 0 4px 12px rgba(0,60,255,0.25); border: none; height: 42px;">
					<i class="icon ion-checkmark-round"></i> Salvar Dados da Missão
				</button>
			</div>
		</div>

		<div style="height: 40px;"></div>
	</ion-content>
</ion-modal-view>
